<!DOCTYPE html>
<!--
  experiment.html -- the static site's experiment page (GitHub Pages, Prolific links).
  Same as preview.html (exp.html with psiturk_stub.js instead of psiturk.js), with relative
  paths so it runs from any folder, and STATIC_SITE so task.js shows consent.html first and
  complete.html last itself. The task comes from ?task=grasp|judge|watch.

  Prolific study URL: .../experiment.html?task=grasp&PROLIFIC_PID={{%PROLIFIC_PID%}}&STUDY_ID={{%STUDY_ID%}}&SESSION_ID={{%SESSION_ID%}}
  Testing: ?who=<name>; quick look: &skip=1&n=2 (no consent/instructions, 2 trials).
-->
<html>
    <head>
        <meta charset="utf-8" />
        <title>Psychology Experiment</title>
        <!-- rel="Favicon" is not a valid rel value; browsers ignore it and fall
             back to requesting /favicon.ico, which 404s -->
        <link rel="icon" href="static/favicon.ico" />

        <!-- libraries used in your experiment
			psiturk specifically depends on underscore.js, backbone.js and jquery
    	-->
		<script src="static/lib/jquery-min.js" type="text/javascript"> </script>
		<script src="static/lib/underscore-min.js" type="text/javascript"> </script>
		<script src="static/lib/backbone-min.js" type="text/javascript"> </script>
		<script src="static/lib/d3.v3.min.js" type="text/javascript"> </script>
		<script src="static/lib/plain-draggable.min.js" type="text/javascript"> </script>
		<script src="static/lib/m-class-list.min.js" type="text/javascript"> </script>

		<script type="text/javascript">
			// Normally supplied by the psiTurk server via Jinja; set here for the static site.
			var uniqueId = null;
			var condition = 0;          // task.js derives the condition from the participant
			var counterbalance = 0;
			var adServerLoc = "";
			var mode = "static";
			window.STATIC_SITE = true;
		</script>

		<!-- utils.js as in exp.html; psiturk_stub.js stands in for psiturk.js -->
		<script src="static/js/utils.js" type="text/javascript"> </script>
		<script src="static/js/psiturk_stub.js" type="text/javascript"> </script>

		<!-- task.js is where you experiment code actually lives
			for most purposes this is where you want to focus debugging, development, etc...
		-->
		<script src="static/js/task.js" type="text/javascript"> </script>

        <link rel="stylesheet" href="static/css/bootstrap.min.css" type="text/css" />
        <link rel="stylesheet" href="static/css/style.css" type="text/css" />
        <link rel="stylesheet" href="static/css/hg.css" type="text/css" />
        <link rel="stylesheet" href="static/css/task.css" type="text/css" />
        <link rel="stylesheet" href="static/css/slider.css" type="text/css" />
        <link rel="stylesheet" href="static/css/radio.css" type="text/css" />
    </head>

    <body>
	    <noscript>
			<h1>Warning: Javascript seems to be disabled</h1>
			<p>This website requires that Javascript be enabled on your browser.</p>
			<p>Instructions for enabling Javascript in your browser can be found
			<a href="http://support.google.com/bin/answer.py?hl=en&answer=23852">here</a></p>
		</noscript>
    </body>
</html>
