<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <link rel="icon" href="/static/favicon.ico" />
        <meta http-equiv="pragma" content="no-cache" />
        <title>Instruct-2</title>
    </head>
    <body>
        <!--container-instructions-->
        <div id="container-instructions">
            <h1 id="instr_header"> Instructions </h1>
            <div class="instructions" id="instruct">
                <div class="well">
                    <p id="toptext" style="color:black;">
                            The fingers squeeze, lift the object, carry it over the green target, and set it down. <br>
                            Whether it holds or <b>slips free</b> depends on where you placed your fingers. <br>
                            You get <b>one try</b> per object.
                    </p>
                </div>

                <tr><td><br/></td></tr>

                <table id="moviescreen" align="center">
                    <tr>
                        <td>
                            <br>
                            <button type="button" id="nextbutton" class="incenterdiv btn btn-success btn-lg">
                                Next
                                <span class="glyphicon glyphicon-arrow-right"></span>
                            </button>
                        </td>
                    </tr>
                </table> <!--END moviescreen-->

            </div> <!--END container-instructions-->
        </div>
    </body>
</html>
